<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title desc">
  <title id="title">How boonOS works</title>
  <desc id="desc">You and your agent work in a folder that brings together projects, context, memory, and skills. With your guidance, feedback and lessons learned can lead to improvements.</desc>
  <defs><linearGradient id="signature" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00DCDE"/><stop offset=".48" stop-color="#FF4CA8"/><stop offset="1" stop-color="#FFE600"/></linearGradient></defs>
  <rect width="640" height="1180" rx="24" fill="#17191B"/>
  <rect x="36" y="35" width="568" height="4" rx="2" fill="url(#signature)"/>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="88" fill="#00DCDE" font-size="19" font-weight="700" letter-spacing="2">HOW IT WORKS</text>
    <text x="320" y="140" fill="#F5F4EF" font-size="35" font-weight="700">Your AI, with your context.</text>
    <rect x="130" y="173" width="380" height="66" rx="12" fill="#282B2D" stroke="#656A6C"/>
    <text x="320" y="216" fill="#F5F4EF" font-size="27" font-weight="700">You + your AI agent</text>
    <path d="M320 239 V270" stroke="#00DCDE" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="48" y="270" width="544" height="120" rx="15" fill="#F1F0EB"/>
    <text x="320" y="323" fill="#17191B" font-size="34" font-weight="700">Your boonOS folder</text>
    <text x="320" y="359" fill="#46494A" font-size="23">the agent reads what you organize and save</text>
    <path d="M320 390 V425" stroke="#888D8E" stroke-width="2" stroke-dasharray="5 6"/>
    <rect x="48" y="425" width="544" height="115" rx="12" fill="#242729" stroke="#626769"/>
    <rect x="48" y="560" width="544" height="115" rx="12" fill="#242729" stroke="#626769"/>
    <rect x="48" y="695" width="544" height="115" rx="12" fill="#242729" stroke="#626769"/>
    <rect x="48" y="830" width="544" height="115" rx="12" fill="#242729" stroke="#626769"/>
    <path d="M320 540 V560 M320 675 V695 M320 810 V830 M320 945 V980" fill="none" stroke="#888D8E" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="320" y="471" fill="#00DCDE" font-size="33" font-weight="700">Projects</text>
    <text x="320" y="510" fill="#D4D2CE" font-size="26">ideas, work, and deliverables</text>
    <text x="320" y="606" fill="#FF79BD" font-size="33" font-weight="700">Context</text>
    <text x="320" y="645" fill="#D4D2CE" font-size="26">your business, choices, and style</text>
    <text x="320" y="741" fill="#FFE600" font-size="33" font-weight="700">Memory</text>
    <text x="320" y="780" fill="#D4D2CE" font-size="26">what to remember and revisit</text>
    <text x="320" y="876" fill="#F5F4EF" font-size="33" font-weight="700">Skills</text>
    <text x="320" y="915" fill="#D4D2CE" font-size="26">instructions to create and review</text>
    <rect x="48" y="980" width="544" height="148" rx="12" fill="#26302F" stroke="#00DCDE" stroke-width="1.5"/>
    <text x="320" y="1033" fill="#00DCDE" font-size="32" font-weight="700">Continuous improvement</text>
    <text x="320" y="1072" fill="#F1F0EB" font-size="25">feedback leads to adjustments</text>
    <text x="320" y="1103" fill="#F1F0EB" font-size="25">with your guidance</text>
  </g>
</svg>
